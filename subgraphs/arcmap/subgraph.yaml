specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SunToken
    network: arc-testnet
    source:
      address: "0x02A0545E0f6Dce7E0Fb68Bc4ed0e9688e29e6Ee1"
      abi: SunToken
      startBlock: 49195767
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: SunToken
          file: ./abis/SunToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/sun-token.ts
